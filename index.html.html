<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>No Cap or Drink — Random Picker</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; background: #05070a; color: white;
    font-family: Arial, Helvetica, sans-serif; display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 520px; padding: 22px 16px 35px; }
  .card {
    background: #0b1220; border: 2px solid #f4c400; border-radius: 22px;
    padding: 22px 16px; box-shadow: 0 10px 35px rgba(0,0,0,.45);
  }
  h1 { text-align:center; margin: 0 0 5px; color:#f4c400; font-size:30px; }
  .tagline { text-align:center; color:#d8d8d8; margin:0 0 22px; font-size:14px; }
  .modes { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
  button {
    border:0; border-radius:14px; min-height:54px; font-weight:800;
    font-size:15px; cursor:pointer; touch-action: manipulation;
  }
  .mode {
    background:#182235; color:#fff; border:2px solid #35445e;
  }
  .mode.active { background:#f4c400; color:#05070a; border-color:#f4c400; }
  .pick {
    width:100%; background:#f4c400; color:#05070a; font-size:20px;
    min-height:64px; margin: 4px 0 18px;
  }
  .pick:active, .mode:active, .reset:active { transform:scale(.98); }
  .number {
    height:155px; display:flex; align-items:center; justify-content:center;
    background:#05070a; border:2px solid #26344c; border-radius:18px;
    font-size:82px; font-weight:900; color:#f4c400; margin-bottom:16px;
  }
  .label { text-align:center; color:#aaa; font-size:13px; margin-bottom:8px; }
  .recent {
    min-height:70px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    background:#080d17; border-radius:14px; padding:12px;
  }
  .pill {
    background:#1b2940; color:#fff; border-radius:999px; padding:8px 12px;
    font-weight:700;
  }
  .reset {
    display:block; margin:14px auto 0; min-height:44px; padding:0 18px;
    background:#182235; color:#fff; border:1px solid #35445e;
  }
  .status { text-align:center; color:#aaa; font-size:12px; margin-top:14px; min-height:16px; }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <h1>NO CAP OR DRINK</h1>
    <p class="tagline">Keep it real… or take the sip.</p>

    <div class="modes">
      <button type="button" class="mode active" data-mode="friends">Friends<br><small>1–66</small></button>
      <button type="button" class="mode" data-mode="talking">Talking Stage<br><small>1–35</small></button>
      <button type="button" class="mode" data-mode="couples">Couples<br><small>1–35</small></button>
    </div>

    <button type="button" class="pick" id="pick">🎲 PICK A NUMBER</button>

    <div class="label" id="rangeLabel">Friends — pick 1 through 66</div>
    <div class="number" id="number">—</div>

    <div class="label">Recent picks</div>
    <div class="recent" id="recent"><span style="color:#777">Your picks will appear here</span></div>

    <button type="button" class="reset" id="reset">Reset Recent Picks</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
(function () {
  const limits = { friends: 66, talking: 35, couples: 35 };
  const names = {
    friends: "Friends",
    talking: "Talking Stage",
    couples: "Couples"
  };

  let mode = "friends";
  let recent = [];

  const numberEl = document.getElementById("number");
  const recentEl = document.getElementById("recent");
  const rangeLabel = document.getElementById("rangeLabel");
  const statusEl = document.getElementById("status");
  const modeButtons = Array.from(document.querySelectorAll(".mode"));

  function render() {
    const max = limits[mode];
    rangeLabel.textContent = names[mode] + " — pick 1 through " + max;

    modeButtons.forEach(function(btn) {
      btn.classList.toggle("active", btn.dataset.mode === mode);
    });

    if (recent.length === 0) {
      recentEl.innerHTML = '<span style="color:#777">Your picks will appear here</span>';
    } else {
      recentEl.innerHTML = recent.map(function(n) {
        return '<span class="pill">' + n + '</span>';
      }).join("");
    }
  }

  function pickNumber() {
    const max = limits[mode];
    const n = Math.floor(Math.random() * max) + 1;
    numberEl.textContent = n;

    recent.unshift(n);
    recent = recent.slice(0, 12);
    render();

    statusEl.textContent = names[mode] + " • " + n;
    if (navigator.vibrate) navigator.vibrate(35);
  }

  modeButtons.forEach(function(btn) {
    btn.addEventListener("click", function() {
      mode = btn.dataset.mode;
      numberEl.textContent = "—";
      statusEl.textContent = "";
      recent = [];
      render();
    });
  });

  document.getElementById("pick").addEventListener("click", pickNumber);

  document.getElementById("reset").addEventListener("click", function() {
    recent = [];
    numberEl.textContent = "—";
    statusEl.textContent = "";
    render();
  });

  render();
})();
</script>
</body>
</html>
