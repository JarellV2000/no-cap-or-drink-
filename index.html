function save() {

}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem("ncdState") || "null");

}

function chooseRandom() {
  const available = pool.filter(x => !used.has(x.n));
  if (!available.length) {
    used.clear();

  const list = pool.filter(x => !used.has(x.n));

  used.add(current.n);

  save();

  const d=DATA[mode];
  $("modeTitle").textContent=d.title;
  $("modeSubtitle").textContent=d.subtitle;
}

function buildFilters() {
  const box=$("filters");
  box.innerHTML="";
  const groups=["All", ...Object.keys(DATA[mode].reduce((o,x)=>{o[x.group]=1;return o;},{}))];
  groups.forEach(g=>{
    const b=document.createElement("button");
    b.className="filter"+(g===filter?" active":"");
    b.textContent=g;
    b.onclick=()=>{
      filter=g; used=new Set(); buildPool(); chooseRandom(); buildFilters(); haptic();
    };
    box.appendChild(b);
  });
}

function renderQuestion() {
  $("group").textContent=current.group;
  $("number").textContent="Question "+current.n;
  $("question").textContent=current.q;
  const total=DATA[mode].length;
  $("counter").textContent=(used.size)+" / "+total;
  $("progressBar").style.width=Math.min(100,(used.size/total)*100)+"%";
  $("result").classList.add("hidden");
  $("result").textContent="";
  $("card").animate([
    {opacity:.35,transform:"translateY(8px) scale(.99)"},
    {opacity:1,transform:"translateY(0) scale(1)"}
  ],{duration:220,easing:"ease-out"});
}

function nextQuestion() {
  chooseRandom(); haptic();
  window.scrollTo({top:0,behavior:"smooth"});
}

function showToast(text) {
  const t=$("toast"); t.textContent=text; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1300);
}

document.querySelectorAll(".mode-card").forEach(b=>b.addEventListener("click",()=>start(b.dataset.mode)));
$("quickStart").onclick=()=>start(["friends","talking","couples"][Math.floor(Math.random()*3)]);
$("next").onclick=nextQuestion;
$("shuffle").onclick=()=>{ used=new Set(); chooseRandom(); haptic(); };
$("noCap").onclick=()=>{ haptic(); $("result").textContent="🔥 NO CAP. Tell the truth."; $("result").classList.remove("hidden"); };
$("drink").onclick=()=>{ drinkCount++; save(); haptic(); showToast("🥃 Take the sip."); $("result").textContent="🥃 Drink recorded. Total drinks this round: "+drinkCount; $("result").classList.remove("hidden"); };
$("back").onclick=()=>{ save(); $("game").classList.add("hidden"); $("home").classList.remove("hidden"); };
$("homeReset").onclick=()=>{ localStorage.removeItem("ncdState"); mode=null; used=new Set(); drinkCount=0; filter="All"; alert("Game progress reset."); };

load();
</script>
</body>
</html>
